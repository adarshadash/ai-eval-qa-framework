[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: metric and dataset unit tests (no SUT calls)
    golden: golden Q&A answer quality
    rag: retrieval + grounding metrics
    agent: tool selection, arguments, trajectories
    multi_turn: conversation context across turns
    safety: red-team, prompt injection, PII
    structured: JSON schema + field accuracy
    consistency: repeated runs, pass rate under non-determinism
    judge: LLM-as-judge calibration against human labels
    performance: latency, tokens and cost budgets
    monitoring: online evals on production traces
    slow: runs each case several times
